name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  mac:
    name: macOS — DMG universel notarisé
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Le tag correspond à package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${version} de package.json."
            exit 1
          fi

      - name: Secrets de signature présents
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing. Voir « Publier une version » dans le README."
            exit 1
          fi

      - run: npm ci

      - name: Certificat dans un fichier temporaire
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

      - name: Construire, signer et notariser
        env:
          CSC_LINK: ${{ runner.temp }}/cert.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarisation par identifiant Apple et mot de passe d'app (appleid.apple.com).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Identifiant d'équipe du certificat Developer ID : public (il figure dans la signature).
          APPLE_TEAM_ID: 7CN9557P92
        run: npm run dist

      - name: Vérifier signature, notarisation et association
        shell: bash
        run: |
          app="release/mac-universal/AV·WAN.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$app/Contents/Info.plist" | grep -x avwan
          # Mises à jour automatiques : electron-updater lit ce fichier dans l'app publiée.
          test -f "$app/Contents/Resources/app-update.yml" && grep -q "repo: AV-WAN" "$app/Contents/Resources/app-update.yml"

      - name: Lancer l’app empaquetée une fois
        shell: bash
        run: |
          AVWAN_EXECUTABLE="$PWD/release/mac-universal/AV·WAN.app/Contents/MacOS/AV·WAN" npx playwright test e2e/smoke.spec.ts

      - run: npm run guide

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/AV-WAN-guide-installation.pdf

      - name: Effacer le certificat
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cert.p12"

  windows:
    name: Windows — installeur NSIS
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win

      - name: Installer en silence et vérifier l’association .avwan
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'AV-WAN-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installeur introuvable dans release/.' }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          if (-not (Test-Path 'HKCU:\Software\Classes\.avwan')) { throw 'Association .avwan absente du registre.' }
          Write-Host 'Association .avwan présente dans HKCU\Software\Classes.'

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  publish:
    name: Brouillon de release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Créer le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -la dist-artifacts
          gh release create "$GITHUB_REF_NAME" dist-artifacts/* \
            --draft --generate-notes --verify-tag \
            --title "AV·WAN ${GITHUB_REF_NAME#v}"
