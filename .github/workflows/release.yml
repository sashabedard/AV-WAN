name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  mac:
    name: macOS — DMG universel notarisé
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Le tag correspond à package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version ${version} de package.json."
            exit 1
          fi

      - name: Secrets de signature présents
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing. Voir « Publier une version » dans le README."
            exit 1
          fi

      - run: npm ci

      - name: Certificat dans un fichier temporaire
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

      - name: Clé API App Store Connect dans un fichier temporaire
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Construire, signer et notariser
        env:
          CSC_LINK: ${{ runner.temp }}/cert.p12
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarisation par clé API App Store Connect (Utilisateurs et accès › Intégrations) :
          # chemin du fichier .p8, identifiant de la clé et identifiant de l'émetteur.
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist

      - name: Vérifier signature, notarisation et association
        shell: bash
        run: |
          app="release/mac-universal/AV·WAN.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$app/Contents/Info.plist" | grep -x avwan
          # Mises à jour automatiques : electron-updater lit ce fichier dans l'app publiée.
          test -f "$app/Contents/Resources/app-update.yml" && grep -q "repo: AV-WAN" "$app/Contents/Resources/app-update.yml"

      - name: Lancer l’app empaquetée une fois
        shell: bash
        run: |
          AVWAN_EXECUTABLE="$PWD/release/mac-universal/AV·WAN.app/Contents/MacOS/AV·WAN" npx playwright test e2e/launch.spec.ts

      - run: npm run guide

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/AV-WAN-guide-installation.pdf
            release/AV-WAN-installation-guide.pdf

      - name: Effacer le certificat et la clé API
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

  windows:
    name: Windows — installeur NSIS et paquet Store
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win

      - name: Installer en silence et vérifier l’association .avwan
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'AV-WAN-*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Installeur introuvable dans release/.' }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          if (-not (Test-Path 'HKCU:\Software\Classes\.avwan')) { throw 'Association .avwan absente du registre.' }
          Write-Host 'Association .avwan présente dans HKCU\Software\Classes.'

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      # Paquet du Microsoft Store : non signé, à téléverser à la main dans Partner Center.
      # Artefact à part, jamais joint à la release GitHub (un .appx non signé ne s'installe pas).
      - name: Paquet Microsoft Store
        run: npx electron-builder --win appx --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: microsoft-store
          if-no-files-found: error
          path: release/*.appx

  linux:
    name: Linux — AppImage et .deb
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:linux

      - name: Lancer l’app empaquetée une fois
        shell: bash
        run: |
          chmod +x release/AV-WAN-*.AppImage
          app="$(ls release/AV-WAN-*.AppImage | head -1)"
          # AppImage sans FUSE : on l'extrait, puis on lance le binaire sous écran virtuel.
          "$app" --appimage-extract >/dev/null
          AVWAN_NO_SANDBOX=1 AVWAN_EXECUTABLE="$PWD/squashfs-root/avwan" xvfb-run -a npx playwright test e2e/launch.spec.ts

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml

  publish:
    name: Brouillon de release
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Par nom : l'artefact microsoft-store reste hors de la release GitHub.
      - uses: actions/download-artifact@v8
        with:
          name: mac
          path: dist-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist-artifacts
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist-artifacts
      - name: Créer le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -la dist-artifacts
          gh release create "$GITHUB_REF_NAME" dist-artifacts/* \
            --draft --generate-notes --verify-tag \
            --title "AV·WAN ${GITHUB_REF_NAME#v}"
