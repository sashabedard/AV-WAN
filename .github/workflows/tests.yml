name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck et tests unitaires
    runs-on: ubuntu-latest
    env:
      # Mêmes dates qu'en local.
      TZ: America/Montreal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
