name: Linux (essai)

# Essai du seul job Linux de la release, sans Mac ni Windows. Se lance à chaque push sur la branche linux.
on:
  push:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — AppImage et .deb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:linux

      - name: Lancer l’app empaquetée une fois
        shell: bash
        run: |
          chmod +x release/AV-WAN-*.AppImage
          app="$(ls release/AV-WAN-*.AppImage | head -1)"
          "$app" --appimage-extract >/dev/null
          AVWAN_NO_SANDBOX=1 AVWAN_EXECUTABLE="$PWD/squashfs-root/avwan" xvfb-run -a npx playwright test e2e/launch.spec.ts

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
