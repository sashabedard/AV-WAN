# Empaquetage d'AV·WAN (electron-builder 26). Sorties dans release/ (ignoré par git).
appId: io.github.sashabedard.avwan
productName: AV·WAN
copyright: © 2026 Sasha Bédard
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true

# Double-clic sur un .avwan (CFBundleDocumentTypes sur macOS, HKCU\Software\Classes sur Windows).
fileAssociations:
  - ext: avwan
    name: Projet AV·WAN
    description: Projet AV·WAN
    role: Editor
    mimeType: application/x-avwan
    icon: icon

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.productivity
  minimumSystemVersion: '13.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: AV-WAN-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: x64

# Linux : AppImage (auto-update) et .deb. L'association .avwan vient de fileAssociations (type MIME + .desktop).
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  category: Office
  maintainer: Sasha Bédard <85566308+sashabedard@users.noreply.github.com>
  synopsis: Schémas de câblage et réseau pour installations AV
  executableName: avwan
  # Le « · » du nom est refusé dans un nom de fichier : dist:linux force productName=AV-WAN, le menu garde AV·WAN.
  desktop:
    entry:
      Name: AV·WAN
  artifactName: AV-WAN-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AV·WAN
  artifactName: AV-WAN-${version}-setup.${ext}

# Paquet du Microsoft Store (npm run dist:store, sur Windows seulement). Non signé : le Store le signe
# à la soumission, d'où aucun avertissement SmartScreen. Les tuiles viennent de build/appx (npm run brand).
appx:
  # Identité réservée dans Partner Center (Gestion des produits › Identité du produit).
  identityName: run-ssh.systems.AVWAN
  publisher: CN=C91FC53B-B21C-4C1E-B347-0959A838DC07
  publisherDisplayName: run-ssh.systems
  applicationId: AVWAN
  displayName: AV·WAN
  backgroundColor: '#1D2125'
  languages: [fr-CA, en-US]
  artifactName: AV-WAN-${version}-store.${ext}

# Mises à jour automatiques : app-update.yml dans l'app, latest*.yml à côté des installeurs.
publish:
  provider: github
  owner: sashabedard
  repo: AV-WAN
